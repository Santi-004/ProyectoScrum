<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador de Metodologías</title>
  <link rel="stylesheet" href="../CSS/CdeM.css">
</head>
<body>
        <h1>Tabla de Metodologías de Desarrollo de Software</h1>
        <div class="botones">
            <button id="btnCascada">Agregar Cascada</button>
            <button id="btnEspiral">Agregar Espiral</button>
            <button id="btnPrototipos">Agregar Prototipos</button>
            <button id="btnRUP">Agregar RUP</button>
            <button id="btnIncremental">Agregar Incremental</button>
            <button id="btnInteractivo">Agregar Interactivo</button>
            <button id="btnEvolutivo">Agregar Evolutivo</button>
            <button id="btnRAD">Agregar RAD</button>
            <button id="btnV">Agregar Modelo en V</button>
            <button id="btnComponentes">Agregar Por Componentes</button>
        </div>

        <table id="tabla">
            <thead>
            <tr>
                <th>Nombre de la Metodología</th>
                <th>Enfoque</th>
                <th>Descripción general</th>
                <th>Fases Principales</th>
                <th>Flexibilidad</th>
                <th>Duración típica del proyecto</th>
                <th>Tamaño de equipo recomendado</th>
                <th>Documentación requerida</th>
                <th>Ventajas principales</th>
                <th>Desventajas principales</th>
                <th>Cuándo usarla</th>
            </tr>
            </thead>
            <tbody>
            <!-- Aquí se agregarán las filas -->
            </tbody>
        </table>
    <script src="../JS/comparador.js"></script>
    </body>
</html>
